name: Publish reviewed phase two

on:
  push:
    branches:
      - codex/happy-soils-phase-2

permissions:
  contents: write

jobs:
  publish:
    if: github.actor == 'urbangreenfarmsaustralia-cpu'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Apply reviewed source
        run: |
          base64 --decode > /tmp/happy-soils-phase-2.patch.gz <<'PATCH'
          
          PATCH
          gzip --decompress --stdout /tmp/happy-soils-phase-2.patch.gz | git apply --index
          git rm .github/workflows/publish-phase-2.yml
          git config user.name "urbangreenfarmsaustralia-cpu"
          git config user.email "urbangreenfarmsaustralia@gmail.com"
          git commit -m "feat: build real paddock intelligence workspace"
          git push origin HEAD:${GITHUB_REF_NAME}
